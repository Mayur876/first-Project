<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Tech Conference 2025 - Event Registration Form</h1>
    <h4>Please fill out the form carefully to complete your registration</h4>
   <form>
    <table>
        <fieldset>
            <legend>Personal Information</legend>
            <label for="fname">Full Name:</label>
            <input type="text" placeholder="Enter your name" required minlength="4">
            <br><br>
            <label for="email">Email Address:</label>
            <input type="text" placeholder="Enter your email">
            <br><br>
            <label for="number">Contact Number:</label>
            <input type="tel" placeholder="Enter your contact number" id="number" maxLength="10">
            <br><br>
            <label for="address">Address:</label>
            <input type="text" placeholder="Enter your address" id="address">
        </fieldset>
            
        <fieldset>
            <legend>Professional Information</legend>
            <label for="Occupation">Occupation:</label>
            <select>
                <option value="Select your occupation">Select your occupation</option>
                <option value="Software Engineer">Software Engineer</option>
                <option value="Data Scientist">Data Scientist</option>
                <option value="Product Manager">Product Manager</option>
            </select>
            <br><br>
            <label for="Experience Level">Experience Level:</label>
            <input type="radio" name="Experience Level" id="Fresher">
            <label for="Fresher">Fresher</label>
            <input type="radio" name="Experience Level" id="intermediate">
            <label for="intermediate">Intermediate</label>
            <input type="radio" name="Experience Level" id="Expert">
            <label for="Expert">Expert</label>
            <br><br>
            <label for="Skills(Select all that applay)">Skills (Select all that apply):</label>
            <input type="checkbox" id="skill1" name="Skills" value="HTML">
            <label for="skill1">HTML</label>
            <input type="checkbox" id="skill2" name="Skills" value="JavaScript">
            <label for="skill2">JavaScript</label>
            <input type="checkbox" id="skill3" name="Skills" value="CSS">
            <label for="skill3">CSS</label>
            <input type="checkbox" id="skill4" name="Skills" value="Python">
            <label for="skill4">Python</label>
            <input type="checkbox" id="skill5" name="Skills" value="Node.js">
            <label for="skill5">Node.js</label>
            <input type="checkbox" id="skill6" name="Skills" value="React">
            <label for="skill6">React</label>
            <input type="checkbox" id="skill7" name="Skills" value="Next.js">
            <label for="skill7">Next.js</label>
            <br><br>
            <label for="Current Organization/College">Current Organization/College:</label>
            <input type="text" placeholder="Enter your College Name">
        </fieldset>
            
        <fieldset>
            <legend>Additional Details</legend>
            <label for="Upload Profile Photo:">Upload Profile Photo:</label>
            <input type="file" id="profilePhoto" name="profilePhoto" accept="image/*">
            <br><br>
            <label for="Preferred Event Date:">Preferred Event Date:</label>
            <input type="date" id="eventDate" name="eventDate">
            <br><br>
            <label for="Why do you want to attend this event?:">Why do you want to attend this event?</label>
            <br>
            <textarea cols="50" placeholder="Please provide your reasons for attending..."></textarea>
            <br>
            <label for="How did you hear about us?:">How did you hear about us?</label>
            <select>
                <option value="Select an option">Select an option</option>
                <option value="Social Media">Social Media</option>
                <option value="Friend">Friend</option>
                <option value="Online Advertisement">Online Advertisement</option>
                <option value="Other">Other</option>
        </fieldset>
            <br><br>
    </table>
            <fieldset>
            <legend>Terms & Conditions</legend>
            <input type="checkbox" id="terms" name="terms" required>
            <label for="terms">I agree to the terms and conditions of the event.</label>
            <br><br>
           
        </fieldset>
            <button type="Register">Register Now</button>

            <button type="reset">Reset</button>
   </form>
    </table>
   </form>
</body>
</html>
